# ── Server ────────────────────────────────────────────────
server.port=8080

# ── SQLite DataSource ──────────────────────────────────────
spring.datasource.url=jdbc:sqlite:budget_tracker.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Limit pool to 1 — SQLite does not support concurrent writers
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-test-query=SELECT 1

# Do NOT let Spring Boot try to auto-run schema.sql / data.sql
spring.sql.init.mode=never

# Disable JPA (we use plain JDBC only)
spring.jpa.open-in-view=false
